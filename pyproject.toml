[build-system]
requires = ["pdm-backend", "wheel"]
build-backend = "pdm.backend"

[project]
name = "aicsshparam"
version = "0.1.11"
description = "Spherical harmonics parametrization for 3D starlike shapes"
authors = [{ name = "Matheus Viana", email = "matheus.viana@alleninstitute.org" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["aicsshparam"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Natural Language :: English",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "vtk",
    "pyshtools>=4.13.1"
]

[project.optional-dependencies]
setup = [
    "pytest-runner>=5.2"
]
test = [
    "black",
    "Flake8-pyproject",
    "flake8",
    "flake8-debugger",
    "pytest",
    "pytest-cov",
    "pytest-raises"
]
dev = [
    "pytest-runner>=5.2",
    "black",
    "Flake8-pyproject",
    "flake8",
    "flake8-debugger",
    "pytest",
    "pytest-cov",
    "pytest-raises",
    "bump-my-version",
    "coverage",
    "ipython",
    "myst-parser",
    "sphinx",
    "furo",
    "tox",
    "twine",
    "wheel"
]
all = [
    "pytest-runner>=5.2",
    "black",
    "Flake8-pyproject",
    "flake8",
    "flake8-debugger",
    "pytest",
    "pytest-cov",
    "pytest-raises",
    "bump-my-version",
    "coverage",
    "ipython",
    "myst-parser",
    "sphinx",
    "furo",
    "tox",
    "twine",
    "wheel"
]

[project.urls]
"Homepage" = "https://github.com/AllenCell/aics-shparam"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "aicsshparam.tests",
    "aicsshparam.tests.*",
    "aicsshparam.bin",
    "aicsshparam.bin.*"
]

[tool.pdm]
distribution = true

[tool.bumpversion]
commit = true
tag = true
current_version = "0.1.11"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/aicsshparam/__init__.py"
search = '{current_version}'
replace = '{new_version}'

[tool.setuptools.bdist_wheel]
universal = true

[tool.setuptools.aliases]
test = "pytest"

[tool.flake8]
exclude = ["docs/"]
ignore = ["E203", "E402", "W291", "W503"]
max-line-length = 88

[tool.pytest.ini_options]
collect_ignore = ["pyproject.toml"]
